name: Functional CPU checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  OPENBLAS_NUM_THREADS: '1'
  GOTO_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  _R_CHECK_EXAMPLE_TIMING_CPU_TO_ELAPSED_THRESHOLD_: '2.5'
  _R_CHECK_TEST_TIMING_CPU_TO_ELAPSED_THRESHOLD_: '2.5'
  _R_CHECK_VIGNETTE_TIMING_CPU_TO_ELAPSED_THRESHOLD_: '2.5'

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      R_KEEP_PKG_SOURCE: yes
      FAISSR_REQUIRE_FAISS: 1
      FAISSR_USE_CUDA: 0
      FAISSR_USE_CUVS: 0
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gfortran git libopenblas-dev liblapack-dev
      - name: Build FAISS 1.14.3 on Linux
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch v1.14.3 https://github.com/facebookresearch/faiss.git /tmp/faiss-src
          cmake -S /tmp/faiss-src -B /tmp/faiss-build -G Ninja \
            -DFAISS_ENABLE_GPU=OFF -DFAISS_ENABLE_PYTHON=OFF \
            -DBUILD_TESTING=OFF -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/faiss
          cmake --build /tmp/faiss-build --parallel 2
          cmake --install /tmp/faiss-build
          echo "FAISS_HOME=/tmp/faiss" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/tmp/faiss/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Install macOS native toolchain
        if: runner.os == 'macOS'
        run: |
          brew install libomp gcc
          echo "FAISSR_FAISS_SOURCE=bundled" >> "$GITHUB_ENV"
          echo "LIBOMP_HOME=$(brew --prefix libomp)" >> "$GITHUB_ENV"
      - name: Record toolchain
        run: |
          R --version
          R CMD config CXX20
          R CMD config FC
          cmake --version
      - name: Build and check
        run: |
          Rscript .github/scripts/limit-check-threads.R --check
          R CMD build .
          tarball=$(find . -maxdepth 1 -name 'faissR_*.tar.gz' -print -quit)
          Rscript -e 'x <- rcmdcheck::rcmdcheck(path=commandArgs(TRUE)[[1]], args="--as-cran", error_on="warning"); stopifnot(!any(grepl("CPU.*elapsed", x$notes)))' "$tarball"
          R CMD INSTALL "$tarball"
      - name: Functional smoke and compact replication
        run: |
          Rscript -e 'library(faissR); stopifnot(faiss_available()); x <- matrix(rnorm(240), 40); z <- nn(x, k=3, method="exact", backend="cpu", n_threads=1); stopifnot(identical(dim(z$indices), c(40L, 3L)))'
          if Rscript -e 'quit(status=if (requireNamespace("Biobase", quietly=TRUE)) 0L else 1L)'; then
            FAISSR_JSS_MODE=compact \
            FAISSR_JSS_DERIVED_DIR="$RUNNER_TEMP/jss-compact" \
            Rscript manuscript/jss/replication_article.R
          else
            echo 'Biobase is unavailable on this R toolchain; archive replication runs in its separate required job.'
          fi

  windows-bundled-faiss:
    runs-on: windows-latest
    env:
      FAISS_HOME: ''
      CONDA_PREFIX: ''
      FAISSR_REQUIRE_FAISS: 1
      FAISSR_FAISS_SOURCE: bundled
      FAISSR_USE_CUDA: 0
      FAISSR_USE_CUVS: 0
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Check functional bundled FAISS and rebuild vignettes
        shell: Rscript {0}
        run: |
          result <- rcmdcheck::rcmdcheck(
            args = c("--as-cran", "--no-manual"),
            error_on = "warning"
          )
          stopifnot(!any(grepl(
            "CPU.*elapsed", result$notes)))

  archive-replication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::openssl
      - name: Verify archive and rebuild reported tables
        run: |
          FAISSR_JSS_MODE=archive \
          FAISSR_JSS_DERIVED_DIR="$RUNNER_TEMP/jss-archive" \
          Rscript manuscript/jss/replication_article.R
          test -f "$RUNNER_TEMP/jss-archive/sessionInfo.txt"

  macos-kmeans-diagnostic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      FAISSR_FAISS_SOURCE: bundled
      FAISSR_REQUIRE_FAISS: '1'
      FAISSR_USE_CUDA: '0'
      FAISSR_USE_CUVS: '0'
      OMP_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Install native toolchain
        run: |
          brew install libomp gcc
          echo "LIBOMP_HOME=$(brew --prefix libomp)" >> "$GITHUB_ENV"
      - name: Build source archive and install privately
        run: |
          R --version
          R CMD build --no-build-vignettes .
          tarball=$(find . -maxdepth 1 -name 'faissR_*.tar.gz' -print -quit)
          shasum -a 256 "$tarball"
          mkdir -p "$RUNNER_TEMP/faissr-lib"
          R CMD INSTALL -l "$RUNNER_TEMP/faissr-lib" "$tarball"
          echo "R_LIBS=$RUNNER_TEMP/faissr-lib" >> "$GITHUB_ENV"
      - name: Fresh-process k-means call
        continue-on-error: true
        run: |
          Rscript --vanilla -e '
            library(faissR)
            set.seed(201)
            x <- rbind(matrix(rnorm(80, -2), ncol = 4),
                       matrix(rnorm(80, 2), ncol = 4))
            fit <- fast_kmeans(x, centers = 2, backend = "cpu",
                               max_iter = 20, n_init = 2,
                               seed = 11, n_threads = 1)
            stopifnot(length(fit$cluster) == nrow(x))
            cat("FRESH_KMEANS_ONE_THREAD_PASS\n")
          '
      - name: Fresh-process two-thread k-means call
        run: |
          Rscript --vanilla -e '
            library(faissR)
            set.seed(201)
            x <- rbind(matrix(rnorm(80, -2), ncol = 4),
                       matrix(rnorm(80, 2), ncol = 4))
            fit <- fast_kmeans(x, centers = 2, backend = "cpu",
                               max_iter = 20, n_init = 2,
                               seed = 11, n_threads = 2)
            stopifnot(length(fit$cluster) == nrow(x))
            cat("FRESH_KMEANS_PASS\n")
          '
      - name: Console test followed by k-means in one process
        run: |
          Rscript --vanilla -e '
            library(testthat)
            library(faissR)
            test_file("tests/testthat/test-bundled-faiss-console.R",
                      reporter = "summary")
            cat("CONSOLE_TEST_RETURNED\n")
            test_file("tests/testthat/test-kmeans.R",
                      reporter = "summary")
            cat("ORDERED_KMEANS_PASS\n")
          '
